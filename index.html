<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>低空经济产业链数据库</title>
<style>
  :root {
    --primary: #2563eb; --primary-dark: #1d4ed8; --secondary: #0ea5e9;
    --bg: #f8fafc; --card: #ffffff; --text: #1e293b; --text-light: #64748b;
    --border: #e2e8f0; --success: #10b981; --warning: #f59e0b; --danger: #ef4444;
    --shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1), 0 2px 4px -2px rgb(0 0 0 / 0.1);
    --shadow-lg: 0 10px 15px -3px rgb(0 0 0 / 0.1), 0 4px 6px -4px rgb(0 0 0 / 0.1);
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; background: var(--bg); color: var(--text); line-height: 1.6; }

  #loginScreen { position: fixed; inset: 0; background: linear-gradient(135deg, #0f172a 0%, #1e3a5f 50%, #0f172a 100%); display: flex; align-items: center; justify-content: center; z-index: 9999; }
  .login-box { background: rgba(255,255,255,0.95); padding: 2.5rem; border-radius: 1rem; width: 90%; max-width: 420px; box-shadow: var(--shadow-lg); text-align: center; }
  .login-box h1 { font-size: 1.75rem; margin-bottom: 0.5rem; background: linear-gradient(90deg, var(--primary), var(--secondary)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
  .login-box p { color: var(--text-light); margin-bottom: 1.5rem; }
  .login-box input { width: 100%; padding: 0.75rem 1rem; border: 2px solid var(--border); border-radius: 0.5rem; font-size: 1rem; margin-bottom: 1rem; }
  .login-box input:focus { outline: none; border-color: var(--primary); }
  .login-box button { width: 100%; padding: 0.75rem; background: var(--primary); color: white; border: none; border-radius: 0.5rem; font-size: 1rem; font-weight: 600; cursor: pointer; }
  .login-box button:hover { background: var(--primary-dark); }
  .login-error { color: var(--danger); font-size: 0.875rem; margin-top: 0.5rem; display: none; }
  .role-select { display: flex; gap: 1rem; justify-content: center; margin-bottom: 1rem; }
  .role-option { cursor: pointer; padding: 0.5rem 1rem; border-radius: 0.5rem; border: 2px solid var(--border); font-size: 0.875rem; transition: all 0.2s; }
  .role-option.active { border-color: var(--primary); background: #eff6ff; color: var(--primary); font-weight: 600; }

  .header { background: var(--card); border-bottom: 1px solid var(--border); padding: 1rem 2rem; position: sticky; top: 0; z-index: 100; box-shadow: var(--shadow); }
  .header-inner { max-width: 1400px; margin: 0 auto; display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 1rem; }
  .logo { font-size: 1.5rem; font-weight: 800; background: linear-gradient(90deg, var(--primary), var(--secondary)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; display: flex; align-items: center; gap: 0.5rem; }
  .user-info { display: flex; align-items: center; gap: 0.75rem; font-size: 0.875rem; }
  .role-badge { padding: 0.25rem 0.625rem; border-radius: 9999px; font-size: 0.75rem; font-weight: 600; }
  .role-admin { background: #dbeafe; color: #1e40af; }
  .role-user { background: #f3f4f6; color: #374151; }
  .mode-tag { padding: 0.25rem 0.75rem; border-radius: 0.375rem; font-size: 0.75rem; font-weight: 600; margin-left: 0.5rem; }
  .mode-admin { background: #fef3c7; color: #92400e; border: 1px solid #fcd34d; }
  .mode-user { background: #ecfdf5; color: #065f46; border: 1px solid #6ee7b7; }

  .data-status-bar { max-width: 1400px; margin: 1rem auto 0; padding: 0 2rem; }
  .data-status { display: flex; align-items: center; gap: 0.75rem; padding: 0.625rem 1rem; border-radius: 0.5rem; font-size: 0.875rem; }
  .data-status.local { background: #fef3c7; color: #92400e; border: 1px solid #fcd34d; }
  .data-status svg { width: 16px; height: 16px; flex-shrink: 0; }

  .toolbar { max-width: 1400px; margin: 1rem auto; padding: 0 2rem; display: flex; gap: 1rem; flex-wrap: wrap; align-items: center; }
  .search-box { position: relative; flex: 1; min-width: 280px; }
  .search-box input { width: 100%; padding: 0.625rem 2.5rem 0.625rem 1rem; border: 1px solid var(--border); border-radius: 0.5rem; font-size: 0.9375rem; }
  .search-box svg { position: absolute; right: 0.75rem; top: 50%; transform: translateY(-50%); color: var(--text-light); width: 18px; height: 18px; }
  .filter-select { padding: 0.625rem 2rem 0.625rem 0.75rem; border: 1px solid var(--border); border-radius: 0.5rem; background: var(--card); font-size: 0.9375rem; cursor: pointer; }
  .btn { padding: 0.625rem 1.25rem; border: none; border-radius: 0.5rem; font-size: 0.9375rem; font-weight: 500; cursor: pointer; display: inline-flex; align-items: center; gap: 0.5rem; transition: all 0.2s; }
  .btn-primary { background: var(--primary); color: white; }
  .btn-primary:hover { background: var(--primary-dark); }
  .btn-secondary { background: var(--card); color: var(--text); border: 1px solid var(--border); }
  .btn-success { background: var(--success); color: white; }
  .btn-warning { background: var(--warning); color: white; }
  .btn-danger { background: var(--danger); color: white; }
  .toolbar-section { display: flex; gap: 0.5rem; flex-wrap: wrap; align-items: center; }
  .toolbar-divider { width: 1px; height: 28px; background: var(--border); }

  .stats { max-width: 1400px; margin: 0 auto 1rem; padding: 0 2rem; display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 1rem; }
  .stat-card { background: var(--card); padding: 1rem; border-radius: 0.75rem; border: 1px solid var(--border); box-shadow: var(--shadow); }
  .stat-card .label { font-size: 0.75rem; color: var(--text-light); text-transform: uppercase; letter-spacing: 0.05em; }
  .stat-card .value { font-size: 1.5rem; font-weight: 700; color: var(--primary); margin-top: 0.25rem; }

  .table-wrap { max-width: 1400px; margin: 0 auto; padding: 0 2rem 2rem; }
  .table-card { background: var(--card); border-radius: 0.75rem; border: 1px solid var(--border); box-shadow: var(--shadow); overflow: hidden; }
  table { width: 100%; border-collapse: collapse; font-size: 0.875rem; }
  thead { background: var(--bg); }
  th, td { padding: 0.875rem 1rem; text-align: left; border-bottom: 1px solid var(--border); }
  th { font-weight: 600; color: var(--text-light); font-size: 0.75rem; text-transform: uppercase; letter-spacing: 0.05em; white-space: nowrap; }
  tbody tr:hover { background: #f1f5f9; }
  .td-name { font-weight: 600; color: var(--text); }
  .tag { display: inline-block; padding: 0.25rem 0.625rem; border-radius: 9999px; font-size: 0.75rem; font-weight: 500; }
  .tag-evtol { background: #dbeafe; color: #1e40af; }
  .tag-drone { background: #d1fae5; color: #065f46; }
  .tag-part { background: #fef3c7; color: #92400e; }
  .tag-infra { background: #ede9fe; color: #5b21b6; }
  .tag-other { background: #f3f4f6; color: #374151; }
  .tag-pending { background: #fee2e2; color: #991b1b; }
  .actions { display: flex; gap: 0.5rem; }
  .actions button { padding: 0.375rem 0.625rem; font-size: 0.75rem; border: none; border-radius: 0.375rem; cursor: pointer; }
  .btn-edit { background: #dbeafe; color: #1e40af; }
  .btn-del { background: #fee2e2; color: #991b1b; }
  .pagination { display: flex; align-items: center; justify-content: center; gap: 0.5rem; padding: 1rem; border-top: 1px solid var(--border); }
  .pagination button { padding: 0.5rem 0.875rem; border: 1px solid var(--border); border-radius: 0.375rem; background: var(--card); cursor: pointer; font-size: 0.875rem; }
  .pagination button:disabled { opacity: 0.5; cursor: not-allowed; }
  .pagination .page-info { color: var(--text-light); font-size: 0.875rem; margin: 0 1rem; }

  .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.5); display: none; align-items: center; justify-content: center; z-index: 200; padding: 1rem; }
  .modal-overlay.active { display: flex; }
  .modal { background: var(--card); border-radius: 1rem; width: 100%; max-width: 560px; max-height: 90vh; overflow-y: auto; box-shadow: var(--shadow-lg); }
  .modal-header { padding: 1.25rem 1.5rem; border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; }
  .modal-close { background: none; border: none; font-size: 1.5rem; cursor: pointer; color: var(--text-light); line-height: 1; }
  .modal-body { padding: 1.5rem; }
  .form-group { margin-bottom: 1rem; }
  .form-group label { display: block; font-size: 0.875rem; font-weight: 500; margin-bottom: 0.375rem; color: var(--text); }
  .form-group input, .form-group select, .form-group textarea { width: 100%; padding: 0.625rem 0.875rem; border: 1px solid var(--border); border-radius: 0.5rem; font-size: 0.9375rem; font-family: inherit; }
  .form-group input:focus, .form-group select:focus, .form-group textarea:focus { outline: none; border-color: var(--primary); }
  .modal-footer { padding: 1rem 1.5rem; border-top: 1px solid var(--border); display: flex; justify-content: flex-end; gap: 0.75rem; }

  .settings-panel { position: fixed; right: -420px; top: 0; bottom: 0; width: 400px; max-width: 90vw; background: var(--card); border-left: 1px solid var(--border); box-shadow: var(--shadow-lg); z-index: 150; transition: right 0.3s ease; display: flex; flex-direction: column; }
  .settings-panel.open { right: 0; }
  .settings-header { padding: 1.25rem; border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; }
  .settings-body { padding: 1.5rem; flex: 1; overflow-y: auto; }
  .settings-body h4 { margin: 1.5rem 0 1rem; color: var(--text-light); font-size: 0.875rem; text-transform: uppercase; }
  .info-box { background: #eff6ff; border: 1px solid #bfdbfe; border-radius: 0.5rem; padding: 0.875rem; font-size: 0.875rem; color: #1e40af; margin-bottom: 1rem; }
  .info-box strong { display: block; margin-bottom: 0.25rem; }

  .toast { position: fixed; bottom: 2rem; right: 2rem; background: var(--text); color: white; padding: 0.875rem 1.25rem; border-radius: 0.5rem; box-shadow: var(--shadow-lg); transform: translateY(100px); opacity: 0; transition: all 0.3s ease; z-index: 300; font-size: 0.9375rem; max-width: 400px; }
  .toast.show { transform: translateY(0); opacity: 1; }
  .toast.success { background: var(--success); }
  .toast.error { background: var(--danger); }
  .toast.warning { background: var(--warning); }

  .empty-state { text-align: center; padding: 3rem; color: var(--text-light); }
  .empty-state svg { width: 64px; height: 64px; margin-bottom: 1rem; opacity: 0.3; }

  @media (max-width: 768px) {
    .header-inner { flex-direction: column; align-items: flex-start; }
    .toolbar { flex-direction: column; align-items: stretch; }
    .search-box { min-width: 100%; }
  }

  /* ===== 防复制 ===== */
  body { -webkit-user-select: none; -moz-user-select: none; user-select: none; }
  input, textarea { -webkit-user-select: text; -moz-user-select: text; user-select: text; }
</style>
</head>
<body>

<div id="loginScreen">
  <div class="login-box">
    <div style="margin-bottom:1rem;">
      <svg width="56" height="56" viewBox="0 0 24 24" fill="none" stroke="url(#grad1)" stroke-width="1.5" style="margin:0 auto;display:block;">
        <defs><linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" style="stop-color:#2563eb;stop-opacity:1" /><stop offset="100%" style="stop-color:#0ea5e9;stop-opacity:1" /></linearGradient></defs>
        <path d="M12 2L2 7l10 5 10-5-10-5z"/><path d="M2 17l10 5 10-5"/><path d="M2 12l10 5 10-5"/>
      </svg>
    </div>
    <h1>低空经济产业链数据库</h1>
    <p>自包含版 · 单文件 · 权限分级</p>
    <div class="role-select">
      <div class="role-option active" onclick="selectRole('admin', this)">管理员</div>
      <div class="role-option" onclick="selectRole('user', this)">普通用户</div>
    </div>
    <input type="text" id="loginUser" placeholder="用户名" onkeydown="if(event.key==='Enter')doLogin()">
    <input type="password" id="loginPwd" placeholder="密码" onkeydown="if(event.key==='Enter')doLogin()">
    <button onclick="doLogin()">进入系统</button>
    <div class="login-error" id="loginError">用户名、密码或角色选择错误</div>
    <div style="margin-top:1rem;font-size:0.75rem;color:#94a3b8;">
      账号密码请联系管理员获取
    </div>
  </div>
</div>

<div id="app" style="display:none;">
  <header class="header">
    <div class="header-inner">
      <div class="logo">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="width:32px;height:32px;">
          <path d="M12 2L2 7l10 5 10-5-10-5z"/><path d="M2 17l10 5 10-5"/><path d="M2 12l10 5 10-5"/>
        </svg>
        低空经济产业链数据库
        <span class="mode-tag mode-admin" id="modeTag">管理模式</span>
      </div>
      <div class="user-info">
        <span id="currentUserName">未登录</span>
        <span class="role-badge" id="currentUserRole">-</span>
        <button class="btn btn-secondary" onclick="toggleSettings()">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
          设置
        </button>
        <button class="btn btn-secondary" onclick="doLogout()">退出</button>
      </div>
    </div>
  </header>

  <div class="data-status-bar" id="dataStatusBar"></div>

  <div class="stats" id="statsBar"></div>

  <div class="toolbar">
    <div class="search-box">
      <input type="text" id="searchInput" placeholder="搜索企业名称、产品、城市..." oninput="handleSearch()">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
    </div>
    <select class="filter-select" id="categoryFilter" onchange="handleFilter()">
      <option value="">全部产业链</option>
      <option value="eVTOL整机">eVTOL整机</option>
      <option value="无人机系统">无人机系统</option>
      <option value="关键零部件">关键零部件</option>
      <option value="基础设施">基础设施</option>
      <option value="运营服务">运营服务</option>
      <option value="材料与制造">材料与制造</option>
      <option value="待分类">待分类</option>
    </select>

    <div class="toolbar-section" id="adminToolbar" style="display:none;">
      <div class="toolbar-divider"></div>
      <button class="btn btn-primary" onclick="openModal()">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 5v14M5 12h14"/></svg>
        新增企业
      </button>
      <button class="btn btn-success" onclick="exportJSON()">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/></svg>
        导出JSON
      </button>
      <button class="btn btn-secondary" onclick="document.getElementById('importFile').click()">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>
        导入JSON
      </button>
      <button class="btn btn-warning" onclick="generatePackage()">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
        生成完整文件
      </button>
      <input type="file" id="importFile" style="display:none" accept=".json" onchange="importData(event)">
    </div>
  </div>

  <div class="table-wrap">
    <div class="table-card">
      <div style="overflow-x:auto;">
        <table>
          <thead>
            <tr>
              <th style="width:60px">#</th>
              <th>企业名称</th>
              <th>产业链环节</th>
              <th>主要产品</th>
              <th>总部城市</th>
              <th>联系方式</th>
              <th style="width:100px; display:none;" id="thAction">操作</th>
            </tr>
          </thead>
          <tbody id="tableBody"></tbody>
        </table>
      </div>
      <div class="pagination" id="pagination"></div>
    </div>
  </div>
</div>

<div class="settings-panel" id="settingsPanel">
  <div class="settings-header">
    <h3>系统设置</h3>
    <button class="modal-close" onclick="toggleSettings()">&times;</button>
  </div>
  <div class="settings-body">
    <div class="info-box">
      <strong>自包含文件说明</strong>
      本文件已内嵌全部数据，可直接发给他人使用。修改后点击「生成完整文件」下载最新版本。
    </div>

    <h4>修改密码</h4>
    <div id="pwdChangeSection">
      <div class="form-group">
        <label>当前密码</label>
        <input type="password" id="oldPwd" placeholder="输入当前密码">
      </div>
      <div class="form-group">
        <label>新密码</label>
        <input type="password" id="newPwd" placeholder="输入新密码">
      </div>
      <div class="form-group">
        <label>确认新密码</label>
        <input type="password" id="confirmPwd" placeholder="再次输入新密码">
      </div>
      <button class="btn btn-primary" style="width:100%;" onclick="changePassword()">修改密码</button>
    </div>
    <div id="pwdChangeDenied" style="display:none; color:var(--text-light); font-size:0.875rem; padding:1rem; text-align:center;">
      普通用户无权修改密码
    </div>

    <div id="userPwdAdminSection" style="display:none;">
      <h4 style="margin-top:2rem;">普通用户密码管理</h4>
      <div class="info-box" style="margin-bottom:1rem;">
        <strong>当前普通用户密码</strong><br>
        <span id="userPwdDisplay" style="font-family:monospace;font-size:1rem;"></span>
      </div>
      <div class="form-group">
        <label>新的普通用户密码</label>
        <input type="password" id="userNewPwd" placeholder="输入新的普通用户密码">
      </div>
      <div class="form-group">
        <label>确认新密码</label>
        <input type="password" id="userConfirmPwd" placeholder="再次输入新密码">
      </div>
      <button class="btn btn-primary" style="width:100%;" onclick="changeUserPassword()">重置普通用户密码</button>
    </div>

    <h4>数据管理</h4>
    <button class="btn btn-success" style="width:100%; margin-bottom:0.5rem;" onclick="exportJSON()">导出JSON备份</button>
    <button class="btn btn-warning" style="width:100%; margin-bottom:0.5rem;" onclick="generatePackage()">生成完整文件（带数据）</button>
    <button class="btn btn-danger" style="width:100%;" onclick="resetAll()">重置为初始数据</button>
    <p style="font-size:0.75rem; color:var(--text-light); margin-top:0.5rem;">重置将清除所有本地修改，恢复为文件初始状态。</p>
  </div>
</div>

<div class="modal-overlay" id="modalOverlay">
  <div class="modal">
    <div class="modal-header">
      <h3 id="modalTitle">新增企业</h3>
      <button class="modal-close" onclick="closeModal()">&times;</button>
    </div>
    <div class="modal-body">
      <input type="hidden" id="editId">
      <div class="form-group"><label>企业名称 *</label><input type="text" id="editName" placeholder="请输入企业全称"></div>
      <div class="form-group">
        <label>产业链环节</label>
        <select id="editCategory">
          <option value="待分类">待分类</option>
          <option value="eVTOL整机">eVTOL整机</option>
          <option value="无人机系统">无人机系统</option>
          <option value="关键零部件">关键零部件</option>
          <option value="基础设施">基础设施</option>
          <option value="运营服务">运营服务</option>
          <option value="材料与制造">材料与制造</option>
        </select>
      </div>
      <div class="form-group"><label>主要产品</label><input type="text" id="editProduct" placeholder="1项核心产品即可"></div>
      <div class="form-group"><label>总部城市</label><input type="text" id="editCity" placeholder="如：深圳"></div>
      <div class="form-group"><label>联系方式</label><input type="text" id="editContact" placeholder="电话/邮箱/官网"></div>
      <div class="form-group"><label>备注</label><textarea id="editNotes" rows="2" placeholder="其他补充信息..."></textarea></div>
    </div>
    <div class="modal-footer">
      <button class="btn btn-secondary" onclick="closeModal()">取消</button>
      <button class="btn btn-primary" onclick="saveRecord()">保存</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
// ===================== 内嵌初始数据 =====================
const INITIAL_DATA = [{"id": 1, "name": "示例企业（部署后请删除）", "category": "eVTOL整机", "product": "示例产品", "city": "深圳", "contact": "400-000-0000", "notes": ""}];
const INITIAL_USERS = {"users": [{"username": "admin", "password": "admin123", "role": "admin", "displayName": "系统管理员"}, {"username": "user", "password": "user123", "role": "user", "displayName": "普通用户"}], "roles": {"admin": {"canCreate": true, "canEdit": true, "canDelete": true, "canExport": true, "canImport": true, "canChangePwd": true}, "user": {"canCreate": false, "canEdit": false, "canDelete": false, "canExport": false, "canImport": false, "canChangePwd": false}}};

// ===================== 状态 =====================
let db = [];
let filtered = [];
let currentPage = 1;
let pageSize = 50;
let currentUser = null;
let userConfig = { users: [], roles: {} };

const LS_DB = 'lae_db_v2';
const LS_USERS = 'lae_users_v2';

// ===================== 初始化 =====================
function init() {
  const savedUsers = localStorage.getItem(LS_USERS);
  if (savedUsers) {
    try { userConfig = JSON.parse(savedUsers); } catch(e) { userConfig = JSON.parse(JSON.stringify(INITIAL_USERS)); }
  } else {
    userConfig = JSON.parse(JSON.stringify(INITIAL_USERS));
  }

  const savedDb = localStorage.getItem(LS_DB);
  if (savedDb) {
    try { db = JSON.parse(savedDb); } catch(e) { db = JSON.parse(JSON.stringify(INITIAL_DATA)); }
  } else {
    db = JSON.parse(JSON.stringify(INITIAL_DATA));
  }
}
init();

function loadData() {
  filtered = [...db];
  renderDataStatus();
  renderStats();
  renderTable();
}

function saveDb() {
  localStorage.setItem(LS_DB, JSON.stringify(db));
  renderDataStatus();
}
function saveUsers() {
  localStorage.setItem(LS_USERS, JSON.stringify(userConfig));
}

function renderDataStatus() {
  const bar = document.getElementById('dataStatusBar');
  if (!bar) return;
  const hasLocal = localStorage.getItem(LS_DB) !== null;
  if (hasLocal) {
    bar.innerHTML = '<div class="data-status local"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"/></svg><div><strong>当前数据来自本地缓存</strong> — 您已做过修改。点击「生成完整文件」下载包含最新数据的单文件，可直接发给他人使用。</div></div>';
  } else {
    bar.innerHTML = '';
  }
}

// ===================== 登录 =====================
let selectedRole = 'admin';
function selectRole(role, el) {
  selectedRole = role;
  document.querySelectorAll('.role-option').forEach(o => o.classList.remove('active'));
  el.classList.add('active');
}

function doLogin() {
  const u = document.getElementById('loginUser').value.trim();
  const p = document.getElementById('loginPwd').value;
  const user = userConfig.users.find(x => x.username === u && x.password === p && x.role === selectedRole);
  if (!user) {
    document.getElementById('loginError').style.display = 'block';
    return;
  }
  currentUser = user;
  document.getElementById('loginScreen').style.display = 'none';
  document.getElementById('app').style.display = 'block';
  document.getElementById('currentUserName').textContent = user.displayName || user.username;

  const roleEl = document.getElementById('currentUserRole');
  roleEl.textContent = user.role === 'admin' ? '管理员' : '普通用户';
  roleEl.className = 'role-badge ' + (user.role === 'admin' ? 'role-admin' : 'role-user');

  const modeTag = document.getElementById('modeTag');
  if (user.role === 'admin') {
    modeTag.textContent = '管理模式';
    modeTag.className = 'mode-tag mode-admin';
  } else {
    modeTag.textContent = '只读模式';
    modeTag.className = 'mode-tag mode-user';
  }

  applyPermissions();
  loadData();
}

function doLogout() {
  currentUser = null;
  document.getElementById('app').style.display = 'none';
  document.getElementById('loginScreen').style.display = 'flex';
  document.getElementById('loginUser').value = '';
  document.getElementById('loginPwd').value = '';
  document.getElementById('loginError').style.display = 'none';
  document.getElementById('settingsPanel').classList.remove('open');
}

function applyPermissions() {
  const perms = userConfig.roles[currentUser.role] || {};
  const isAdmin = currentUser.role === 'admin';

  document.getElementById('adminToolbar').style.display = isAdmin ? 'flex' : 'none';
  document.getElementById('thAction').style.display = (perms.canEdit || perms.canDelete) ? 'table-cell' : 'none';

  const pwdSection = document.getElementById('pwdChangeSection');
  const pwdDenied = document.getElementById('pwdChangeDenied');
  if (perms.canChangePwd) {
    pwdSection.style.display = 'block';
    pwdDenied.style.display = 'none';
  } else {
    pwdSection.style.display = 'none';
    pwdDenied.style.display = 'block';
  }

  document.getElementById('userPwdAdminSection').style.display = isAdmin ? 'block' : 'none';
}

function hasPerm(key) {
  if (!currentUser) return false;
  const perms = userConfig.roles[currentUser.role] || {};
  return !!perms[key];
}

// ===================== 修改密码 =====================
function changePassword() {
  if (!hasPerm('canChangePwd')) { showToast('无权修改密码', 'error'); return; }
  const oldPwd = document.getElementById('oldPwd').value;
  const newPwd = document.getElementById('newPwd').value;
  const confirmPwd = document.getElementById('confirmPwd').value;

  if (oldPwd !== currentUser.password) { showToast('当前密码错误', 'error'); return; }
  if (!newPwd) { showToast('新密码不能为空', 'error'); return; }
  if (newPwd !== confirmPwd) { showToast('两次输入的新密码不一致', 'error'); return; }

  currentUser.password = newPwd;
  const u = userConfig.users.find(x => x.username === currentUser.username);
  if (u) u.password = newPwd;
  saveUsers();

  document.getElementById('oldPwd').value = '';
  document.getElementById('newPwd').value = '';
  document.getElementById('confirmPwd').value = '';
  showToast('密码修改成功', 'success');
}

// ===================== 修改普通用户密码（仅管理员） =====================
function changeUserPassword() {
  if (!currentUser || currentUser.role !== 'admin') { showToast('仅管理员可操作', 'error'); return; }
  const newPwd = document.getElementById('userNewPwd').value;
  const confirmPwd = document.getElementById('userConfirmPwd').value;

  if (!newPwd) { showToast('新密码不能为空', 'error'); return; }
  if (newPwd !== confirmPwd) { showToast('两次输入的新密码不一致', 'error'); return; }

  const u = userConfig.users.find(x => x.role === 'user');
  if (!u) { showToast('未找到普通用户账号', 'error'); return; }
  u.password = newPwd;
  saveUsers();

  document.getElementById('userNewPwd').value = '';
  document.getElementById('userConfirmPwd').value = '';
  document.getElementById('userPwdDisplay').textContent = newPwd;
  showToast('普通用户密码已重置', 'success');
}

// ===================== 设置面板 =====================
function toggleSettings() {
  const panel = document.getElementById('settingsPanel');
  panel.classList.toggle('open');
  if (panel.classList.contains('open') && currentUser && currentUser.role === 'admin') {
    const u = userConfig.users.find(x => x.role === 'user');
    document.getElementById('userPwdDisplay').textContent = u ? u.password : '(未找到)';
  }
}

function resetAll() {
  if (!confirm('确定重置？这将清除所有本地修改，恢复为文件初始状态。')) return;
  localStorage.removeItem(LS_DB);
  localStorage.removeItem(LS_USERS);
  db = JSON.parse(JSON.stringify(INITIAL_DATA));
  userConfig = JSON.parse(JSON.stringify(INITIAL_USERS));
  filtered = [...db];
  renderDataStatus();
  renderStats();
  renderTable();
  showToast('已重置为初始状态', 'success');
}

// ===================== 统计 =====================
function renderStats() {
  const cats = {};
  let completed = 0;
  db.forEach(r => {
    cats[r.category] = (cats[r.category] || 0) + 1;
    if (r.product && r.product !== '待补充') completed++;
  });
  const html = '<div class="stat-card"><div class="label">企业总数</div><div class="value">' + db.length + '</div></div>' +
    '<div class="stat-card"><div class="label">信息完整</div><div class="value" style="color:var(--success)">' + completed + '</div></div>' +
    '<div class="stat-card"><div class="label">eVTOL整机</div><div class="value">' + (cats['eVTOL整机']||0) + '</div></div>' +
    '<div class="stat-card"><div class="label">无人机系统</div><div class="value">' + (cats['无人机系统']||0) + '</div></div>' +
    '<div class="stat-card"><div class="label">关键零部件</div><div class="value">' + (cats['关键零部件']||0) + '</div></div>' +
    '<div class="stat-card"><div class="label">待分类</div><div class="value" style="color:var(--warning)">' + (cats['待分类']||0) + '</div></div>';
  document.getElementById('statsBar').innerHTML = html;
}

function getTagClass(cat) {
  switch(cat) {
    case 'eVTOL整机': return 'tag-evtol';
    case '无人机系统': return 'tag-drone';
    case '关键零部件': return 'tag-part';
    case '基础设施': return 'tag-infra';
    case '待分类': return 'tag-pending';
    default: return 'tag-other';
  }
}

function renderTable() {
  const tbody = document.getElementById('tableBody');
  const start = (currentPage - 1) * pageSize;
  const pageData = filtered.slice(start, start + pageSize);
  const showActions = hasPerm('canEdit') || hasPerm('canDelete');

  if (pageData.length === 0) {
    tbody.innerHTML = '<tr><td colspan="' + (showActions?7:6) + '"><div class="empty-state"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"/><polyline points="3.27 6.96 12 12.01 20.73 6.96"/><line x1="12" y1="22.08" x2="12" y2="12"/></svg><div>暂无匹配数据</div></div></td></tr>';
  } else {
    tbody.innerHTML = pageData.map(r => {
      let actionCell = showActions
        ? '<td><div class="actions">' +
          (hasPerm('canEdit') ? '<button class="btn-edit" onclick="editRecord(' + r.id + ')">编辑</button>' : '') +
          (hasPerm('canDelete') ? '<button class="btn-del" onclick="deleteRecord(' + r.id + ')">删除</button>' : '') +
          '</div></td>'
        : '<td></td>';
      return '<tr><td>' + r.id + '</td><td class="td-name">' + escapeHtml(r.name) + '</td><td><span class="tag ' + getTagClass(r.category) + '">' + escapeHtml(r.category) + '</span></td><td class="td-product">' + escapeHtml(r.product||'') + '</td><td>' + escapeHtml(r.city||'') + '</td><td>' + escapeHtml(r.contact||'') + '</td>' + actionCell + '</tr>';
    }).join('');
  }
  renderPagination();
}

function renderPagination() {
  const totalPages = Math.ceil(filtered.length / pageSize);
  let html = '<button onclick="goPage(' + (currentPage-1) + ')" ' + (currentPage<=1?'disabled':'') + '>上一页</button>';
  html += '<span class="page-info">' + currentPage + ' / ' + (totalPages||1) + ' 页 (共 ' + filtered.length + ' 条)</span>';
  html += '<button onclick="goPage(' + (currentPage+1) + ')" ' + (currentPage>=totalPages?'disabled':'') + '>下一页</button>';
  document.getElementById('pagination').innerHTML = html;
}
function goPage(p) {
  const total = Math.ceil(filtered.length / pageSize);
  if (p < 1 || p > total) return;
  currentPage = p;
  renderTable();
}

function handleSearch() {
  const q = document.getElementById('searchInput').value.trim().toLowerCase();
  applyFilter(q, document.getElementById('categoryFilter').value);
}
function handleFilter() {
  applyFilter(document.getElementById('searchInput').value.trim().toLowerCase(), document.getElementById('categoryFilter').value);
}
function applyFilter(q, cat) {
  filtered = db.filter(r => {
    const matchQ = !q || (r.name && r.name.toLowerCase().includes(q)) || (r.product && r.product.toLowerCase().includes(q)) || (r.city && r.city.toLowerCase().includes(q));
    const matchCat = !cat || r.category === cat;
    return matchQ && matchCat;
  });
  currentPage = 1;
  renderTable();
}

// ===================== 增删改 =====================
function openModal() {
  if (!hasPerm('canCreate')) { showToast('无权操作', 'error'); return; }
  document.getElementById('modalTitle').textContent = '新增企业';
  document.getElementById('editId').value = '';
  document.getElementById('editName').value = '';
  document.getElementById('editCategory').value = '待分类';
  document.getElementById('editProduct').value = '';
  document.getElementById('editCity').value = '';
  document.getElementById('editContact').value = '';
  document.getElementById('editNotes').value = '';
  document.getElementById('modalOverlay').classList.add('active');
}
function editRecord(id) {
  if (!hasPerm('canEdit')) { showToast('无权操作', 'error'); return; }
  const r = db.find(x => x.id === id);
  if (!r) return;
  document.getElementById('modalTitle').textContent = '编辑企业';
  document.getElementById('editId').value = r.id;
  document.getElementById('editName').value = r.name;
  document.getElementById('editCategory').value = r.category;
  document.getElementById('editProduct').value = r.product || '';
  document.getElementById('editCity').value = r.city || '';
  document.getElementById('editContact').value = r.contact || '';
  document.getElementById('editNotes').value = r.notes || '';
  document.getElementById('modalOverlay').classList.add('active');
}
function closeModal() {
  document.getElementById('modalOverlay').classList.remove('active');
}
function saveRecord() {
  const id = document.getElementById('editId').value;
  const name = document.getElementById('editName').value.trim();
  if (!name) { showToast('企业名称不能为空', 'error'); return; }
  const record = {
    id: id ? parseInt(id) : (db.length>0?Math.max(...db.map(x=>x.id))+1:1),
    name: name,
    category: document.getElementById('editCategory').value,
    product: document.getElementById('editProduct').value.trim() || '待补充',
    city: document.getElementById('editCity').value.trim() || '待补充',
    contact: document.getElementById('editContact').value.trim() || '待补充',
    notes: document.getElementById('editNotes').value.trim()
  };
  if (id) {
    const idx = db.findIndex(x => x.id === parseInt(id));
    if (idx >= 0) db[idx] = record;
  } else {
    db.push(record);
  }
  saveDb();
  closeModal();
  handleSearch();
  renderStats();
  showToast('保存成功', 'success');
}
function deleteRecord(id) {
  if (!hasPerm('canDelete')) { showToast('无权操作', 'error'); return; }
  if (!confirm('确定删除该记录？')) return;
  db = db.filter(x => x.id !== id);
  saveDb();
  handleSearch();
  renderStats();
  showToast('已删除', 'success');
}

// ===================== 导入导出 =====================
function exportJSON() {
  if (!hasPerm('canExport')) { showToast('无权操作', 'error'); return; }
  const blob = new Blob([JSON.stringify(db, null, 2)], {type:'application/json'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = '低空经济数据库_' + new Date().toISOString().slice(0,10) + '.json';
  a.click();
  URL.revokeObjectURL(url);
}

function importData(e) {
  if (!hasPerm('canImport')) { showToast('无权操作', 'error'); return; }
  const file = e.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = ev => {
    try {
      const data = JSON.parse(ev.target.result);
      if (Array.isArray(data) && data.length>0 && data[0].name) {
        if (confirm('确认导入 ' + data.length + ' 条记录？当前数据将被覆盖。')) {
          db = data;
          saveDb();
          handleSearch();
          renderStats();
          showToast('导入成功', 'success');
        }
      } else {
        showToast('文件格式不正确', 'error');
      }
    } catch(err) {
      showToast('解析失败: ' + err.message, 'error');
    }
  };
  reader.readAsText(file);
  e.target.value = '';
}

// ===================== 生成完整文件 =====================
function generatePackage() {
  if (!hasPerm('canExport')) { showToast('无权操作', 'error'); return; }

  const currentHtml = document.documentElement.outerHTML;
  const newDataStr = JSON.stringify(db);
  const newUsersStr = JSON.stringify(userConfig);

  // 使用正则替换内嵌数据，匹配任意内容
  let newHtml = currentHtml
    .replace(/const INITIAL_DATA = \[.*?\];/, 'const INITIAL_DATA = ' + newDataStr + ';')
    .replace(/const INITIAL_USERS = \{.*?\};/, 'const INITIAL_USERS = ' + newUsersStr + ';');

  const blob = new Blob([newHtml], {type:'text/html'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = '低空经济数据库_' + new Date().toISOString().slice(0,10) + '.html';
  a.click();
  URL.revokeObjectURL(url);
  showToast('完整文件已生成，可直接发给他人使用', 'success');
}

// ===================== 工具 =====================
function showToast(msg, type) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.className = 'toast ' + type;
  setTimeout(() => t.classList.add('show'), 10);
  setTimeout(() => t.classList.remove('show'), 4000);
}
function escapeHtml(text) {
  if (!text) return '';
  const div = document.createElement('div');
  div.textContent = text;
  return div.innerHTML;
}

document.getElementById('modalOverlay').addEventListener('click', e => {
  if (e.target === document.getElementById('modalOverlay')) closeModal();
});

// ===================== 防复制保护 =====================
(function () {
  function isEditable(el) {
    return el && (el.tagName === 'INPUT' || el.tagName === 'TEXTAREA' || el.isContentEditable);
  }
  // 禁用右键菜单
  document.addEventListener('contextmenu', e => e.preventDefault());
  // 禁用复制/剪切/拖拽（输入框内除外）
  document.addEventListener('copy', e => { if (!isEditable(e.target)) e.preventDefault(); });
  document.addEventListener('cut', e => { if (!isEditable(e.target)) e.preventDefault(); });
  document.addEventListener('dragstart', e => e.preventDefault());
  // 禁用 F12、Ctrl/Cmd+U(查看源码)、Ctrl/Cmd+S(保存网页)、Ctrl/Cmd+P(打印)、Ctrl+Shift+I/J/C(开发者工具)
  document.addEventListener('keydown', e => {
    if (e.key === 'F12') { e.preventDefault(); return; }
    if (e.ctrlKey || e.metaKey) {
      const k = e.key.toLowerCase();
      if (e.shiftKey && ['i', 'j', 'c'].includes(k)) { e.preventDefault(); return; }
      if (['u', 's', 'p'].includes(k)) { e.preventDefault(); return; }
      if (k === 'c' && !isEditable(e.target)) e.preventDefault();
    }
  });
})();
</script>
</body>
</html>
